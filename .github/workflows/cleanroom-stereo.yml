name: Independent stereo core tests
on:
  pull_request:
    paths:
      - 'backend/cleanroom_stereo.py'
      - 'backend/test_cleanroom_stereo.py'
      - '.github/workflows/cleanroom-stereo.yml'
  push:
    branches: [master]
    paths:
      - 'backend/cleanroom_stereo.py'
      - 'backend/test_cleanroom_stereo.py'
      - '.github/workflows/cleanroom-stereo.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s backend -p 'test_cleanroom_stereo.py' -v
